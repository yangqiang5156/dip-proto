# 放入 ai.liqi123.com 的 server 扩展配置，仅处理本项目路径。
location ~ ^/work/dip-proto/(v[0-9]+\.[0-9]+)$ {
    return 301 /work/dip-proto/$1/;
}
location ~ ^/work/dip-proto/v[0-9]+\.[0-9]+/assets/ {
    root /www/wwwroot/ai;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/work/dip-proto/(?<dip_series>v[0-9]+\.[0-9]+)/ {
    root /www/wwwroot/ai;
    try_files $uri $uri/ /work/dip-proto/$dip_series/index.html =404;
    add_header Cache-Control "no-cache" always;
}
